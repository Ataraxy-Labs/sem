name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc -p sem-cli

      # Release, on the build step's target so its artifacts are reused: the
      # wall-time and scale tests are calibrated for optimized binaries, and a
      # debug build on this runner overruns them. --no-fail-fast reports every
      # failing test binary instead of stopping at the first.
      - name: Run tests
        run: cargo test --release --target x86_64-pc-windows-msvc --no-fail-fast -p sem-core -p sem-cli

      - name: Check binary exists
        run: dir target\x86_64-pc-windows-msvc\release\sem.exe
