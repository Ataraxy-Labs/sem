min_args = 1

[[call]]
kind = "http_out"
langs = ["go"]
callee = ["http.Get", "http.Post", "http.Head", "http.PostForm", "*.client.Get", "*.client.Post"]
arg = 0
min_args = 1

[[call]]
kind = "http_out"
langs = ["go"]
callee = ["http.NewRequest", "http.NewRequestWithContext"]
arg = "url"
min_args = 2

[[call]]
kind = "http_out"
langs = ["rs"]
callee = ["reqwest::get", "*client.get", "*client.post", "*client.put", "*client.patch", "*client.delete", "*client.request", "*.http_client.post", "*.http_client.get"]
arg = 0
min_args = 1

[[call]]
kind = "http_out"
langs = ["ts", "js"]
callee = ["fetch", "axios", "axios.*", "*.axios.*", "http.request", "https.request", "http.get", "https.get", "*.$http.*", "*.http.get", "*.http.post", "*.http.put", "*.http.delete", "*client).get", "*client).post", "*client).put", "*client).delete", "*client).patch", "*.request", "ky.*", "got", "got.*", "superagent.*"]
arg = 0
min_args = 1

# ---------------------------------------------------------------- queues
[[call]]
kind = "queue"
langs = ["py", "go", "rs", "ts", "js"]
callee = ["*.publish", "*.Publish", "*.basic_publish", "*.send_message", "*.SendMessage", "*.produce", "*.Produce", "*.sendToQueue", "*.subscribe", "*.Subscribe", "*.basic_consume", "*.consume", "*.Consume"]
arg = 0
receiver = ["pub", "queue", "topic", "kafka", "amqp", "channel", "producer", "consumer", "sqs", "sns", "nats", "broker", "bus"]

# ---------------------------------------------------------------- subprocess / fs
[[call]]
kind = "subprocess"
langs = ["py"]
callee = ["subprocess.*", "os.system", "os.popen", "os.exec*", "os.spawn*", "asyncio.create_subprocess_exec", "asyncio.create_subprocess_shell"]
arg = 0

[[call]]
kind = "subprocess"
langs = ["go"]
callee = ["exec.Command", "exec.CommandContext"]
arg = 0

[[call]]
kind = "subprocess"
langs = ["rs"]
callee = ["Command::new", "std::process::Command::new", "process::Command::new", "tokio::process::Command::new"]
arg = 0

[[call]]
kind = "subprocess"
langs = ["ts", "js"]
callee = ["child_process.*", "*.execSync", "*.spawnSync", "execSync", "spawnSync", "spawn", "execFile", "execa", "spawn.*", "cp.*", "*.fork"]
arg = 0

[[call]]
kind = "fs"
langs = ["go"]
callee = ["os.WriteFile", "os.Create", "os.OpenFile", "ioutil.WriteFile", "os.Remove", "os.RemoveAll", "os.MkdirAll", "os.Rename"]
arg = 0

[[call]]
kind = "fs"
langs = ["rs"]
callee = ["fs::write", "std::fs::write", "File::create", "fs::create_dir_all", "std::fs::create_dir_all", "fs::remove_file", "fs::remove_dir_all", "fs::copy", "fs::rename", "tokio::fs::write"]
arg = 0

[[call]]
kind = "fs"
langs = ["ts", "js"]
callee = ["fs.writeFile*", "fs.appendFile*", "fs.createWriteStream", "fs.unlink*", "fs.rm*", "fs.mkdir*", "fs.rename*", "fs.copyFile*", "writeFile", "writeFileSync", "mkdirs", "rmdir", "unlink", "*.writeFile", "*.outputFile"]
