# Boundary-site models: where data leaves or enters the code.
#
# Each [[call]] matches call sites by callee text (whitespace removed,
# argument lists collapsed to `()`); `*` matches any run of characters.
# Fields:
#   kind      sql | env | http_out | rpc_out | queue | dispatch | route_in | subprocess | fs
#   langs     py | go | rs | ts | js
#   callee    patterns
#   arg       index of the argument carrying the key / SQL / URL / path
#             ("last" = last argument)
#   min_args  skip calls with fewer arguments
#   decorator true = only decorators/attributes, false = only plain calls
#   handler   route_in: "decorated" | "last" | "to" (actix `.to(h)`) | "inner" (axum `get(h)`)
#   method    route_in/http_out: fixed HTTP method; otherwise the callee's
#             last segment if it names one, else ANY
#   receiver  the receiver text must contain one of these (case-insensitive)
#
# [[member]] matches member/subscript reads (`process.env.X`, `os.environ["X"]`).
# [[registry]] pairs registration calls with lookup calls by key.

# ---------------------------------------------------------------- env
[[call]]
kind = "env"
langs = ["py"]
callee = ["os.getenv", "getenv", "os.environ.get", "environ.get", "os.environ.setdefault"]
arg = 0

[[call]]
kind = "env"
langs = ["go"]
callee = ["os.Getenv", "os.LookupEnv", "viper.GetString", "viper.GetInt", "viper.GetBool", "viper.Get", "viper.GetDuration"]
arg = 0

[[call]]
kind = "env"
langs = ["rs"]
callee = ["std::env::var", "env::var", "std::env::var_os", "env::var_os", "env!", "option_env!", "dotenvy::var", "dotenv::var"]
arg = 0

[[member]]
kind = "env"
langs = ["py"]
text = ["*environ[]"]

[[member]]
kind = "env"
langs = ["ts", "js"]
text = ["process.env.*", "import.meta.env.*"]

# ---------------------------------------------------------------- sql
[[call]]
kind = "sql"
langs = ["py"]
callee = ["*.execute", "*.executemany", "*.executescript", "*.exec_driver_sql", "*.execute_write", "*.execute_write_fn", "*.execute_fn", "*.raw", "text", "sqlalchemy.text", "sa.text"]
arg = 0
min_args = 1

[[call]]
kind = "sql"
langs = ["go"]
callee = ["*.Exec", "*.ExecContext", "*.Query", "*.QueryContext", "*.QueryRow", "*.QueryRowContext", "*.NamedExec", "*.NamedExecContext"]
arg = "sql"
min_args = 1
# a database handle, not gin's `c.Query("param")`
receiver = ["db", "tx", "conn", "stmt", "pool", "sql", "repo", "store"]

[[call]]
kind = "sql"
langs = ["go"]
callee = ["*.Raw", "*.Select", "*.Get", "*.GetContext", "*.SelectContext", "*.Prepare", "*.PrepareContext"]
arg = "sql"
min_args = 1
require_sql = true

# ORM operations: the table comes from a model class named in the call, or
# (failing that) the models the enclosing entity mentions.
[[call]]
kind = "sql"
langs = ["py"]
callee = ["*session.add", "*session.add_all", "*session.delete", "*session.get", "*session.exec", "*session.scalars", "*session.scalar", "*session.query", "*session.merge", "*.query.get", "*.query.get_or_404", "*.query.filter_by", "*.query.filter", "*.query.all", "*.query.first", "*.query.count", "*.paginate", "*.objects.*"]
arg = 0
orm = true

[[call]]
kind = "sql"
langs = ["go"]
callee = ["*.First", "*.Find", "*.Create", "*.Save", "*.Delete", "*.Updates", "*.Update", "*.Model", "*.AutoMigrate", "*.Association", "*.Count", "*.Take", "*.Last", "*.FirstOrCreate", "*.Pluck", "*.Scan"]
arg = 0
orm = true
receiver = ["db", "tx", "gorm", "conn", "orm"]

[[call]]
kind = "sql"
langs = ["ts", "js"]
callee = ["*prisma.*.find*", "*prisma.*.create*", "*prisma.*.update*", "*prisma.*.delete*", "*prisma.*.upsert", "*prisma.*.count", "*prisma.*.aggregate", "*prisma.*.groupBy", "*Repository.find*", "*Repository.save", "*Repository.delete", "*Repository.remove", "*Repository.update", "*Repository.insert", "*Repository.count", "*Repository.createQueryBuilder", "getRepository", "*.createQueryBuilder"]
arg = 0
orm = true

[[call]]
kind = "sql"
langs = ["rs"]
callee = ["sqlx::query!", "sqlx::query_as!", "sqlx::query_scalar!", "query!", "query_as!", "query_scalar!", "sqlx::query", "sqlx::query_as", "sqlx::query_scalar", "query", "query_as"]
arg = "sql"
min_args = 1

[[call]]
kind = "sql"
langs = ["ts", "js"]
callee = ["*.query", "*.$queryRaw", "*.$executeRaw", "*.$queryRawUnsafe", "*.$executeRawUnsafe", "*.raw", "*.run", "*.exec", "*.prepare", "*.all", "*.get"]
arg = 0
min_args = 1
require_sql = true

# ---------------------------------------------------------------- http out
