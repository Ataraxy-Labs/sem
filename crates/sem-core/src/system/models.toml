[[call]]
kind = "fs"
langs = ["py"]
callee = ["shutil.*", "os.remove", "os.unlink", "os.makedirs", "os.rename", "os.replace", "*.write_text", "*.write_bytes", "*.mkdir", "*.unlink"]
arg = 0

# ---------------------------------------------------------------- reflective dispatch
[[call]]
kind = "dispatch"
langs = ["py"]
callee = ["getattr", "importlib.import_module", "import_module", "__import__", "*.load_entrypoints", "*.load_setuptools_entrypoints", "*.hook.*"]
arg = 1

[[call]]
kind = "dispatch"
langs = ["go"]
callee = ["*.MethodByName", "*.FieldByName", "plugin.Open", "*.Lookup", "reflect.*.Call", "*.Call"]
arg = 0
receiver = ["reflect", "plugin", "value", "method", "sym"]

[[call]]
kind = "dispatch"
langs = ["ts", "js"]
callee = ["require", "import", "Reflect.*"]
arg = 0
dynamic_only = true

# ---------------------------------------------------------------- inbound routes
[[call]]
kind = "route_in"
langs = ["py"]
callee = ["*.route", "*.get", "*.post", "*.put", "*.patch", "*.delete", "*.head", "*.options", "*.api_route", "*.websocket"]
decorator = true
arg = 0
handler = "decorated"

[[call]]
kind = "route_in"
langs = ["py"]
callee = ["*.add_url_rule", "*.add_route", "*.add_api_route", "path", "re_path", "url"]
decorator = false
arg = 0
handler = "last"
path_like = true

# datasette-style route tables: `add_route(View.as_view(ds), r"/regex")`
[[call]]
kind = "route_in"
langs = ["py"]
callee = ["add_route"]
decorator = false
arg = 1
handler = "first"
path_like = true
min_args = 2

[[call]]
kind = "route_in"
langs = ["ts", "js"]
callee = ["*.get", "*.post", "*.put", "*.patch", "*.delete", "*.all", "*.options", "*.head"]
decorator = false
arg = 0
handler = "last"
path_like = true
min_args = 2

[[call]]
kind = "route_in"
langs = ["ts", "js"]
callee = ["Get", "Post", "Put", "Patch", "Delete", "All", "Options", "Head"]
decorator = true
arg = 0
handler = "decorated"
prefix_class_decorator = "Controller"

[[call]]
kind = "route_in"
langs = ["go"]
callee = ["*.GET", "*.POST", "*.PUT", "*.PATCH", "*.DELETE", "*.Any", "*.Handle", "*.HandleFunc", "*.Get", "*.Post", "*.Put", "*.Patch", "*.Delete", "*.Method", "*.MethodFunc"]
arg = 0
handler = "last"
path_like = true
min_args = 2

[[call]]
kind = "route_in"
langs = ["rs"]
callee = ["get", "post", "put", "patch", "delete", "route", "actix_web::get", "actix_web::post", "web::get", "web::post"]
decorator = true
arg = 0
handler = "decorated"

[[call]]
kind = "route_in"
langs = ["rs"]
callee = ["*.route", "web::resource", "*.service"]
decorator = false
arg = 0
handler = "to"
path_like = true
min_args = 2

# ---------------------------------------------------------------- registries
# `X.register(key, fn)` and `X.exec(key)` on a registry whose receiver ends
# with the same segment are one dispatch point with a finite candidate set.
[[registry]]
langs = ["ts", "js"]
register = ["*.register"]
lookup = ["*.exec", "*.execSync", "*.call", "*.run", "*.render", "*.renderSync"]
key_arg = 0
value_arg = "last"

[[registry]]
langs = ["go"]
register = ["plugin.Register", "caddy.RegisterPlugin", "*.Register", "*.RegisterModule"]
lookup = []
key_arg = 0
value_arg = "last"

[[registry]]
langs = ["py"]
register = ["*.register", "*.connect", "*.add_hook"]
lookup = ["*.get", "*.dispatch", "*.send", "*.fire"]
key_arg = 0
value_arg = "last"
